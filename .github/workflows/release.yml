name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.0.0"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PROJECT_PATH: Los.csproj
  ROTATION_PATH: BLM\BlackMageRotation.cs
  ASSEMBLY_NAME: Los
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
  ACR_AUTHOR: "Los"
  ACR_DESCRIPTION: "一个全等级黑魔ACR 支持日随/高难"
  ACR_API_VERSION: "15"
  ACR_SOURCE_REPOSITORY_URL: "https://github.com/Elio0825/Los_PR"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "${{ github.ref_name }}"
            if ($version.StartsWith("v")) {
              $version = $version.Substring(1)
            }
          }

          $parsedVersion = $null
          if (-not [System.Version]::TryParse($version, [ref]$parsedVersion)) {
            throw "Version '$version' is not a valid System.Version value."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: pwsh
        run: dotnet restore $env:PROJECT_PATH

      - name: Sync rotation version
        shell: pwsh
        run: |
          $path = "${{ github.workspace }}\${{ env.ROTATION_PATH }}"
          $version = "${{ steps.version.outputs.version }}"
          $text = Get-Content -LiteralPath $path -Raw
          $pattern = '(?s)(\[RotationMetadata\(\s*25u,\s*(?:"Los 黑魔ACR"|LosPlatform\.RotationName),\s*(?:"Los"|LosPlatform\.Author),\s*")[^"]+("\s*,)'
          $regex = [regex]::new($pattern)

          if (-not $regex.IsMatch($text)) {
            throw "Could not find Los RotationMetadata version in $path"
          }

          $updated = $regex.Replace($text, '${1}' + $version + '${2}', 1)
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($path, $updated, $utf8NoBom)
          Write-Host "RotationMetadata version updated to $version"

      - name: Build
        id: build
        shell: pwsh
        run: |
          $publishDir = "${{ runner.temp }}\publish"
          dotnet build $env:PROJECT_PATH `
            --configuration Release `
            --no-restore `
            -p:Version="${{ steps.version.outputs.version }}" `
            -p:TreatWarningsAsErrors=true `
            -p:OutputPath="$publishDir" `
            -p:AppendTargetFrameworkToOutputPath=false `
            -p:AppendRuntimeIdentifierToOutputPath=false
          if ($LASTEXITCODE -ne 0) { throw "CN Release build failed." }

          $dllPath = Join-Path $publishDir "${{ env.ASSEMBLY_NAME }}.dll"
          $depsPath = Join-Path $publishDir "${{ env.ASSEMBLY_NAME }}.deps.json"
          if (-not (Test-Path -LiteralPath $dllPath)) {
            throw "Build output not found: $dllPath"
          }
          if (-not (Test-Path -LiteralPath $depsPath)) {
            throw "Build output not found: $depsPath"
          }

          $referenceJson = dotnet msbuild $env:PROJECT_PATH -nologo -verbosity:quiet `
            -p:Configuration=Release -target:ResolveReferences -getItem:ReferencePath
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve CN compiler references." }
          $resolved = ($referenceJson -join [Environment]::NewLine) | ConvertFrom-Json
          $promeReference = @($resolved.Items.ReferencePath | Where-Object {
            [IO.Path]::GetFileName($_.Identity) -eq 'PromeRotation.dll'
          })
          if ($promeReference.Count -ne 1) { throw "Expected one PR compiler reference." }
          $referenceVersion = [Reflection.AssemblyName]::GetAssemblyName($promeReference[0].Identity).Version
          "reference_prome_version=$referenceVersion" >> $env:GITHUB_OUTPUT

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $publishDir = "${{ runner.temp }}\publish"
          $distDir = "${{ runner.temp }}\dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null

          $dllPath = Join-Path $publishDir "${{ env.ASSEMBLY_NAME }}.dll"
          $depsPath = Join-Path $publishDir "${{ env.ASSEMBLY_NAME }}.deps.json"
          $zipPath = Join-Path $distDir "Los.zip"
          Compress-Archive -LiteralPath @($dllPath, $depsPath) -DestinationPath $zipPath -Force

          $sha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$sha256" >> $env:GITHUB_OUTPUT
          Write-Host "SHA256: $sha256"

      - name: Generate repo.json
        shell: pwsh
        run: |
          $distDir = "${{ runner.temp }}\dist"
          $repoPath = Join-Path $distDir "repo.json"
          $manifest = [ordered]@{
            author = "${{ env.ACR_AUTHOR }}"
            version = "${{ steps.version.outputs.version }}"
            description = "${{ env.ACR_DESCRIPTION }}"
            supportedJobs = @(
              [ordered]@{
                job = "BLM"
                contentScope = "All"
              }
            )
            apiVersion = [int]"${{ env.ACR_API_VERSION }}"
            referencePromeVersion = "${{ steps.build.outputs.reference_prome_version }}"
            downloadUrl = "${{ github.server_url }}/${{ github.repository }}/releases/latest/download/Los.zip"
            sourceRepositoryUrl = "${{ env.ACR_SOURCE_REPOSITORY_URL }}"
            sha256 = "${{ steps.package.outputs.sha256 }}"
          }

          $json = $manifest | ConvertTo-Json -Depth 8
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText($repoPath, $json, $utf8NoBom)
          Write-Host "repo.json written to $repoPath"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            ${{ runner.temp }}\dist\Los.zip
            ${{ runner.temp }}\dist\repo.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          make_latest: true
          files: |
            ${{ runner.temp }}\dist\Los.zip
            ${{ runner.temp }}\dist\repo.json
